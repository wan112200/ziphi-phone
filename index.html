<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>我的小手机</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}

body {
    background: #111;
}

.phone {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #dfe9ff, #f5e6ff 55%, #dff7ff);
}

/* 顶部状态栏 */
.status-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 54px;
    padding: 10px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    font-size: 15px;
    font-weight: 600;
}

.status-right {
    display: flex;
    gap: 7px;
    align-items: center;
}

/* 灵动岛 */
.dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 34px;
    background: #000;
    border-radius: 22px;
    z-index: 30;
}

/* 锁屏 */
.lock-screen {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 100px;
    transition: transform .45s ease, opacity .45s ease;
}

.lock-screen.hidden {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
}

.lock-time {
    font-size: 76px;
    line-height: 1;
    font-weight: 300;
    letter-spacing: -4px;
}

.lock-date {
    margin-top: 12px;
    font-size: 20px;
    font-weight: 500;
}

.lock-weather {
    margin-top: 20px;
    padding: 9px 17px;
    border-radius: 22px;
    background: rgba(255,255,255,.38);
    backdrop-filter: blur(15px);
    font-size: 15px;
}

.unlock-hint {
    position: absolute;
    bottom: 75px;
    font-size: 14px;
    opacity: .65;
}

/* 桌面 */
.home-screen {
    position: absolute;
    inset: 0;
    padding: 75px 20px 30px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
}

.home-screen.active {
    opacity: 1;
    pointer-events: auto;
}

/* 小组件 */
.widget {
    margin-top: 8px;
    padding: 18px;
    border-radius: 25px;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(20px);
    box-shadow: 0 10px 35px rgba(50,50,80,.12);
}

.widget-title {
    font-size: 14px;
    opacity: .7;
}

.widget-time {
    margin-top: 5px;
    font-size: 32px;
    font-weight: 600;
}

.widget-date {
    margin-top: 3px;
    font-size: 14px;
}

/* App 网格 */
.app-grid {
    margin-top: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 14px;
}

.app {
    text-align: center;
    font-size: 12px;
}

.app-icon {
    width: 58px;
    height: 58px;
    margin: auto;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    background: rgba(255,255,255,.72);
    box-shadow: 0 7px 18px rgba(0,0,0,.12);
}

.app-name {
    margin-top: 6px;
}

/* 底部 Dock */
.dock {
    margin-top: auto;
    padding: 12px 10px;
    border-radius: 28px;
    background: rgba(255,255,255,.35);
    backdrop-filter: blur(20px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.dock .app-icon {
    width: 54px;
    height: 54px;
}

/* 小手机比例 */
@media (min-width: 600px) {
    .phone {
        width: 393px;
        height: 852px;
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
        border-radius: 45px;
        box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #222;
    }
}

/* 点击反馈 */
.app-icon:active {
    transform: scale(.92);
}
</style>
</head>

<body>

<div class="phone">

    <div class="status-bar">
        <span id="statusTime">21:00</span>

        <div class="status-right">
            <span>▮▮▮</span>
            <span>Wi-Fi</span>
            <span>🔋</span>
        </div>
    </div>

    <div class="dynamic-island"></div>

    <!-- 锁屏 -->
    <section class="lock-screen" id="lockScreen">

        <div class="lock-time" id="lockTime">21:00</div>

        <div class="lock-date" id="lockDate">
            2026年9月29日 星期二
        </div>

        <div class="lock-weather">
            ☁️ 天气待设置
        </div>

        <div class="unlock-hint">
            点击屏幕进入桌面
        </div>

    </section>

    <!-- 桌面 -->
    <main class="home-screen" id="homeScreen">

        <div class="widget">

            <div class="widget-title">
                我的手机
            </div>

            <div class="widget-time" id="homeTime">
                21:00
            </div>

            <div class="widget-date" id="homeDate">
                2026年9月29日
            </div>

        </div>

        <div class="app-grid">

            <div class="app">
                <div class="app-icon">💬</div>
                <div class="app-name">AI聊天</div>
            </div>

            <div class="app">
                <div class="app-icon">👤</div>
                <div class="app-name">角色</div>
            </div>

            <div class="app">
                <div class="app-icon">📖</div>
                <div class="app-name">世界书</div>
            </div>

            <div class="app">
                <div class="app-icon">📝</div>
                <div class="app-name">备忘录</div>
            </div>

            <div class="app">
                <div class="app-icon">🎮</div>
                <div class="app-name">游戏</div>
            </div>

            <div class="app">
                <div class="app-icon">🌐</div>
                <div class="app-name">浏览器</div>
            </div>

            <div class="app">
                <div class="app-icon">⚙️</div>
                <div class="app-name">设置</div>
            </div>

            <div class="app">
                <div class="app-icon">＋</div>
                <div class="app-name">添加</div>
            </div>

        </div>

        <div class="dock">

            <div class="app">
                <div class="app-icon">📞</div>
            </div>

            <div class="app">
                <div class="app-icon">💬</div>
            </div>

            <div class="app">
                <div class="app-icon">📷</div>
            </div>

            <div class="app">
                <div class="app-icon">⚙️</div>
            </div>

        </div>

    </main>

</div>

<script>

function updateTime() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const time = hours + ":" + minutes;

    document.getElementById("statusTime").textContent = time;
    document.getElementById("lockTime").textContent = time;
    document.getElementById("homeTime").textContent = time;

    const year = now.getFullYear();
    const month = now.getMonth() + 1;
    const day = now.getDate();

    const week = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ][now.getDay()];

    document.getElementById("lockDate").textContent =
        `${year}年${month}月${day}日 ${week}`;

    document.getElementById("homeDate").textContent =
        `${year}年${month}月${day}日`;
}

updateTime();
setInterval(updateTime, 1000);

document.getElementById("lockScreen").addEventListener("click", function () {

    this.classList.add("hidden");

    document.getElementById("homeScreen")
        .classList.add("active");

});

</script>

</body>
</html>
